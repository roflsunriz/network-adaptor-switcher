name: 機能提案
description: 新機能や改善の提案
title: '[Feature] '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |-
        誰のどの問題を解決するかと、提案・代替案・互換性を共有してください。
        導入・利用・開発方法は [README](https://github.com/roflsunriz/network-adaptor-switcher/blob/HEAD/README.md) を確認してください。
        本文と添付に秘密情報や個人情報を含めないでください。脆弱性の詳細は公開せず、[セキュリティ方針](https://github.com/roflsunriz/network-adaptor-switcher/blob/HEAD/SECURITY.md) を確認してください。
  - type: checkboxes
    id: preflight
    attributes:
      label: 事前確認
      options:
        - label: 同じ内容の既存Issueを検索しました。
          required: true
        - label: READMEと関連する利用・更新手順を確認しました。
          required: true
  - type: textarea
    id: original-1
    attributes:
      label: 機能の概要
      placeholder: 提案する機能や改善を簡潔に説明してください
  - type: textarea
    id: original-2
    attributes:
      label: 解決したい問題
      placeholder: なぜこの機能が必要なのか、どのような問題を解決するのか説明してください
    validations:
      required: true
  - type: textarea
    id: original-3
    attributes:
      label: 提案する解決方法
      placeholder: この機能をどのように実装すべきか、アイデアを説明してください
    validations:
      required: true
  - type: textarea
    id: original-4
    attributes:
      label: 代替案と互換性
      placeholder: 検討した代替案があれば記載してください
      description: 既存の設定・保存データ・利用者への影響も記載してください。
  - type: textarea
    id: original-5
    attributes:
      label: 参考資料
      placeholder: 関連するドキュメントやリンクがあれば記載してください
  - type: checkboxes
    id: original-6
    attributes:
      label: 優先度
      description: この機能の重要度を選択してください。
      options:
        - label: 高（必須機能）
        - label: 中（あると便利）
        - label: 低（あれば嬉しい）
  - type: textarea
    id: original-7
    attributes:
      label: 補足
      placeholder: その他、補足情報があれば記載してください
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: 本文・ログ・画像・添付から、認証情報、Cookie、トークン、秘密鍵、個人情報を除いたことを確認しました。
          required: true
